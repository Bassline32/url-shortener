server:
  port: 8080

#start
spring:
  datasource:
    url: JDBC:postgresql://localhost:8080/url_shortener
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Используем Flyway для миграций
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

#end

  app:
    base-url: http://localhost:8080
    default-expiration-days: 30