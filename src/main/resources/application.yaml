server:
  port: 8080

spring:

  threads:
    virtual:
      enabled: true


  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  flyway:
    enabled: true
    locations: classpath:db/migration


  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: "async-"
    scheduling:
      pool:
        size: 3
      thread-name-prefix: "scheduled-"


logging:
  level:
    com.example.urlshortener: DEBUG


app:
  base-url: http://localhost:8080
  default-expiration-days: 30
